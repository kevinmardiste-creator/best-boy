const tm=t=>{const[a,b]=(t||'0:0').split(':').map(Number);return a*60+(b||0)};

const TABS=[['day','Päev'],['cs','Callsheet'],['crew','Töötunnid'],['gear','Tehnika'],['cal','Kalender'],['mh','Meeskond'],['proj','Projekt']];
const COL=['#f59e0b','#38bdf8','#a3e635','#f472b6','#c084fc','#2dd4bf'];
const defRules=()=>[
 {id:'max',t:'max',label:'Normaalpäev (h, lõuna sees)',val:12,on:true},
 {id:'lunch',t:'lunch',label:'Lõuna algab hiljemalt (h pärast individuaalset calli)',val:6,on:true},
 {id:'rest',t:'rest',label:'Katkematu puhkeaeg (h), loetakse baasi/hotelli jõudmisest',val:11,on:true},
 {id:'week',t:'week',label:'Max järjestikuseid tööpäevi',val:5,on:true},
 {id:'night',t:'night',label:'Öötöö 22:00–06:00 (algab kell)',val:'22:00',on:false},
 {id:'n1',t:'note',label:'Hommiku- ja õhtusöök ei lähe tööaja sisse',val:'',on:true},
 {id:'n2',t:'note',label:'Puhkepäev = 11h puhkeaeg + 24h',val:'',on:true},
 {id:'n3',t:'note',label:'Crew call algab rendist/baasist (tehnikaauto juht), muidu võtteplatsilt, linnapiirilt või hotellist',val:'',on:true}];
const defGear=()=>[['LED','Aputure 600d'],['LED','Tuubivalgustid'],['HMI','M18 HMI'],['HMI','4K HMI'],['Tungsten','2K Fresnel'],['Tungsten','Junior 1K'],['Kaablid','Stingerid 20m'],['Kaablid','Jaotuskarbid'],['Statiivid ja rigging','C-standid'],['Statiivid ja rigging','Flagid ja silkid'],['Kulumaterjal','Geelid'],['Kulumaterjal','Gaffer-teip'],['Kulumaterjal','Klambrid'],['Kulumaterjal','Pirnid']].map(([c,n])=>({id:uid(),cat:c,name:n,ok:false,bad:false,q:5}));
const newP=n=>({id:uid(),name:n,loc:'',day:1,days:5,call:'07:00',wrap:'19:00',lunch:'13:00',rules:defRules(),crew:[],gear:defGear(),loans:[],req:[],sheets:[],lat:59.437,lon:24.754,pw:{cap:32,items:[]},photos:[]});
function load(){try{const x=JSON.parse(localStorage.getItem('bb2')||localStorage.getItem('bb1'));if(x&&x.projects){x.projects.forEach(p=>{const m=p.rules&&p.rules.find(z=>z.id=='max');if(m&&m.val==11){m.val=12;m.label='Normaalpäev (h, lõuna sees)'}if(!p.pw){p.rules=defRules();p.lat=59.437;p.lon=24.754;p.pw={cap:32,items:[]};p.photos=[];if(!p.gear.some(g=>g.q!=null))p.gear.push(...defGear().filter(g=>g.cat=='Kulumaterjal'))}});return x}}catch(e){}const p=newP('Projekt 1');return{cur:p.id,projects:[p],crewDb:[],cal:[]}}
function save(){S.projects.forEach(p=>{if(p.cd&&p.crew)p.cd[p.date]=p.crew;if(p.dd&&p.dd[p.date])Object.assign(p.dd[p.date],{day:p.day,days:p.days,loc:p.loc,call:p.call,wrap:p.wrap,lunch:p.lunch,lk:(p.lk&&p.lk.d==p.date)?p.lk:null})});try{localStorage.setItem('bb2',JSON.stringify(S))}catch(e){}if(typeof syDirty=='function')syDirty();if(typeof shDirty=='function')shDirty()}
let S=load(),tab='day',gcat='LED';
const P=()=>{const p=S.projects.find(p=>p.id===S.cur)||S.projects[0];fixP(p);return p};
const rule=(p,id)=>p.rules.find(x=>x.id===id&&x.on);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const inp=(t,v,js,x='')=>`<input type="${t}" value="${esc(v)}" onchange="${js}" ${x}>`;
function setPin(v){const p=P(),e=p.dd[p.date]=p.dd[p.date]||{};['pin','clat','clon'].forEach(k=>{delete p[k];delete e[k]});if(v){const c=coordsFrom(v);p.pin=e.pin=v;if(c){p.clat=e.clat=c[0];p.clon=e.clon=c[1]}}save();r()}
const upd=(k,v)=>{const p=P();p[k]=v;if(k=='loc')['pin','clat','clon','xl','ln'].forEach(z=>{delete p[z];if(p.dd[p.date])delete p.dd[p.date][z]});save();r()};

function vDay(p){
 let bad=0,warn=0;p.crew.forEach(c=>flags(p,c).forEach(([l])=>l=='red'?bad++:warn++));
 const due=S.projects.flatMap(q=>q.loans.filter(l=>!l.back&&l.due&&l.due<=new Date(Date.now()+864e5).toISOString().slice(0,10)).map(l=>({...l,pn:q.name})));
 return `<div class="card"><div class="sub">Võttepäev</div>
 <div class="flex items-center gap-2 text-2xl font-bold">${inp('number',p.day,"upd('day',+this.value)",'class="!w-16 !text-xl"')} / ${inp('number',p.days,"upd('days',+this.value)",'class="!w-16 !text-xl"')} päeva</div></div>
 <div class="card grid grid-cols-2 gap-2">
  <label class="col-span-2 sub">Asukoht${inp('text',p.loc,"upd('loc',this.value)",'placeholder="nt Tallinn, Telliskivi"')}</label>
  <label class="sub">Crew call${inp('time',p.call,"upd('call',this.value)")}</label>
  <label class="sub">Hinnanguline wrap${inp('time',p.wrap,"upd('wrap',this.value)")}</label>
  <label class="sub col-span-2">Lõuna kell${inp('time',p.lunch,"upd('lunch',this.value)")}</label></div>
 <div class="card text-center"><div class="sub">Lõunani</div><div id="cd" class="text-5xl font-extrabold text-amber-400 tabular-nums">--:--:--</div></div>
 <div class="card ${bad?'red':warn?'org':'ok'}"><b>Reeglite kokkuvõte:</b> ${bad} rikkumist, ${warn} hoiatust (${p.crew.length} inimest)</div>
 ${due.length?`<div class="card org"><b>Meeldetuletus: tagasi toomata tehnika</b>${due.map(l=>`<div>${esc(l.item)} → ${esc(l.to)} (${esc(l.pn)}), tähtaeg ${l.due}${l.due<today()?' – hilinenud':''}</div>`).join('')}</div>`:''}`}

let crewTail='';
const tchip=(id,k,lab,v,hint,cls='')=>`<div class="rounded-xl border border-slate-600 bg-slate-900 p-2 text-center ${cls}"><div class="text-[10px] uppercase tracking-wide text-slate-400">${lab}</div><input type="text" inputmode="numeric" maxlength="5" placeholder="TT:MM" data-t24="1" value="${esc(v||'')}" onchange="cuD('${id}','${k}',this.value)" class="!bg-transparent !border-0 !p-0 text-center text-xl font-extrabold tabular-nums w-full"><div class="text-[10px] text-slate-400">${hint||'&nbsp;'}</div></div>`;
function vCrew(p){
 const n=(rule(p,'max')?.val||12)*60,sum=L=>({h:L.reduce((a,c)=>a+dur(c),0),ot:L.reduce((a,c)=>a+Math.max(0,dur(c)-n),0),c:L.filter(c=>c.drv).length}),T=sum(p.crew),
 tile=(a,b,cl='')=>`<div class="card text-center"><div class="sub">${a}</div><div class="text-xl font-extrabold tabular-nums ${cl}">${b}</div></div>`,
 chip=(t,c)=>`<span class="text-xs font-bold rounded-full px-2 py-0.5" style="background:${c};color:#0f172a">${t}</span>`,
 dl=`<datalist id="db">${S.crewDb.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>`,
 team=(()=>{const nm=new Set([...p.crew.map(c=>c.name),...Object.values(p.cd||{}).flatMap(L=>(L||[]).map(c=>c.name)),...Object.keys(p.roles||{})]);TEAM=[...nm].sort((a,b)=>a.localeCompare(b));const rl=n=>(p.roles||{})[n]||((Object.values(p.cd||{}).flat().find(c=>c&&c.name==n)||{}).role)||ROLES[3];
  return TEAM.length?`<details class="card"><summary class="font-bold">Projekti meeskond ja rollid</summary><div class="sub mt-1">Roll salvestub kogu projektile: muudad ühe korra, kehtib kõikidel päevadel ja uutel call sheetidel.</div><div class="space-y-2 mt-2">${TEAM.map((n,i)=>`<div class="flex items-center justify-between gap-2"><span>${esc(n)}</span><select onchange="setRoleI(${i},this.value)">${ROLES.map(x=>`<option ${x==rl(n)?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')}</div></details>`:''})(),
 add=`<details class="card"><summary class="font-bold">＋ Lisa meeskonnaliige</summary><div class="space-y-2 mt-2"><input id="nn" list="db" placeholder="Nimi (andmebaasist või uus)" onchange="const k=S.crewDb.find(x=>x.name==this.value);if(k)$('#nr').value=k.role">
  <div class="grid grid-cols-3 gap-2"><select id="nr">${ROLES.map(x=>`<option>${x}</option>`).join('')}</select>${inp('time',p.call,'','id="nc"')}${inp('time',p.wrap,'','id="nw"')}</div><button class="btn p w-full" onclick="addCrew()">Lisa</button></div></details>`,
 cards=p.crew.map(c=>{const f=flags(p,c),lv=f.some(x=>x[0]=='red')?'red':f.length?'org':'ok',d=dur(c),pct=Math.min(100,Math.round(d/(n*1.25)*100)),bar=lv=='red'?'#ef4444':lv=='org'?'#f59e0b':'#22c55e';
  return `<div class="card ${lv} space-y-2"><div class="flex justify-between items-start gap-2"><div><b class="text-lg">${esc(c.name)}</b> ${c.drv?chip('🚚 C-sõitja','#fbbf24'):''}<div class="sub">${esc(c.role)}${streakOf(p,c)>1?` · <b>${streakOf(p,c)}. päev järjest</b>`:''}</div></div><div class="text-right"><div class="text-2xl font-extrabold tabular-nums">${fm(d)}</div>${c.act?'':'<div class="sub">plaanis</div>'}${d>n?`<div class="text-amber-300 text-sm">+${fm(d-n)} ületunde</div>`:''}</div></div>
  ${p.date==workDay()&&c.call?`<div class="text-center py-1"><div class="sub elpl">Võttel olnud</div><div class="elp text-3xl font-extrabold tabular-nums text-amber-300" data-c="${esc(c.call)}" data-e="${esc(c.act||c.wrap||'')}" data-a="${c.act?1:0}" data-d="${p.date}"></div></div>`:''}
  <div class="flex items-center gap-2 text-sm tabular-nums"><span>${esc(c.call||'--:--')}</span><div class="flex-1 h-2 rounded-full bg-slate-700 overflow-hidden"><div class="h-2 rounded-full elb" style="width:${pct}%;background:${bar};transition:width 1s linear"></div></div><span>${esc(c.act||c.wrap||'--:--')}</span></div>
  ${(()=>{const pw=c.prev||prevWrap(p,c);if(!pw||!c.call)return '';const g=(tm(c.call)-tm(pw)+1440)%1440;return `<div class="sub">Turnaround <b>${fm(g)}</b> <span class="text-slate-400">(eelmine wrap ${esc(pw)})</span></div>`})()}
  ${c.act?(c.act!=c.wrap?`<div class="sub">Plaanis wrap ${esc(c.wrap||'')}, tegelik ${esc(c.act)}</div>`:''):''}
  ${f.map(([l,m])=>`<div class="${l=='red'?'text-red-300':'text-amber-300'} font-semibold text-sm">${l=='red'?'⛔':'⚠'} ${esc(m)}</div>`).join('')}
  <details><summary class="btn text-center">Muuda / aruanded</summary><div class="space-y-3 mt-3">
   <div class="grid grid-cols-3 gap-2">${tchip(c.id,'call','Call',c.call,'')}${tchip(c.id,'wrap','Wrap (plaan)',c.wrap,'')}${tchip(c.id,'act','Tegelik wrap',c.act,c.act?`<button class="underline" onclick="cu('${c.id}','act','')">tühjenda</button>`:'sisesta päeva lõpus',c.act?'!border-amber-400':'')}</div>
   ${rule(p,'rest')?`<div class="grid grid-cols-3 gap-2">${tchip(c.id,'prev','Eelmine wrap',c.prev||prevWrap(p,c),c.prev?`<button class="underline" onclick="cu('${c.id}','prev','')">automaatne</button>`:'automaatne eelmisest päevast')}<div class="col-span-2 sub self-center">Turnaround arvutatakse sellest ajast selle päeva callini.</div></div>`:''}
   <div class="flex gap-2 flex-wrap"><select class="rounded-full" onchange="cu('${c.id}','role',this.value)">${ROLES.map(x=>`<option ${x==c.role?'selected':''}>${x}</option>`).join('')}</select>
    <button class="rounded-full px-3 py-1.5 text-sm font-semibold border ${c.drv?'bg-amber-400 text-slate-900 border-amber-400':'border-slate-500'}" onclick="cu('${c.id}','drv',${!c.drv})">🚚 C-sõitja</button>
    <button class="rounded-full px-3 py-1.5 text-sm font-semibold border ${c.nolunch?'bg-amber-400 text-slate-900 border-amber-400':'border-slate-500'}" onclick="cu('${c.id}','nolunch',${!c.nolunch})">🍽 Lõuna penalty ei kehti</button></div>
   <div class="grid grid-cols-2 gap-2"><button class="btn" onclick="out=wmsg('${c.id}');tab='day';r()">Wrap-sõnum</button><button class="btn d" onclick="P().crew=P().crew.filter(x=>x.id!='${c.id}');save();r()">Eemalda</button></div></div></details></div>`}).join(''),
 ds=Object.keys(p.cd||{}).filter(d=>d<p.date&&(p.cd[d]||[]).length).sort().reverse().slice(0,40),
 hist=ds.length?`<div class="space-y-2"><b>Eelmised päevad</b>${ds.map(d=>{const L=p.cd[d],t=sum(L),bad=L.some(c=>flags(p,c,d).some(x=>x[0]=='red')),w=L.some(c=>flags(p,c,d).length);
  return `<details class="card"><summary class="flex justify-between items-center gap-2"><b>${fmtD(d)}</b><span class="sub">${L.length} inimest</span></summary><div class="mt-2 space-y-1">${L.map(c=>`<div class="flex justify-between gap-2 border-t border-slate-600 pt-1"><span>${esc(c.name)} <span class="sub">${esc(c.role||'')}</span>${c.drv?' '+chip('C','#fbbf24'):''}</span><span class="tabular-nums text-right">${esc(c.call||'')}–${esc(c.act||c.wrap||'')} <b>${fm(dur(c))}</b></span></div>${flags(p,c,d).map(x=>`<div class="text-xs ${x[0]=='red'?'text-red-300':'text-amber-300'}">${x[0]=='red'?'⛔':'⚠'} ${esc(x[1])}</div>`).join('')}`).join('')}<button class="btn w-full mt-2" onclick="setDate(P(),'${d}');r()">Ava ja muuda seda päeva</button><button class="btn d w-full mt-2" onclick="delDay('${d}')">Kustuta see päev (tunnid)</button></div></details>`}).join('')}</div>`:'';
 let bk='';try{const B=JSON.parse(localStorage.getItem('bb2_bk')||'[]');if(B.length)bk=`<details class="card"><summary class="font-bold">Varukoopiad (sünkroon)</summary><div class="sub mt-1">Enne iga sünkroonist laadimist salvestatakse selle seadme seis. Siit saad selle tagasi.</div><div class="space-y-2 mt-2">${B.map((b,i)=>`<div class="flex items-center justify-between gap-2"><span>${new Date(b.t).toLocaleString('et')} <span class="sub">${esc(b.w||'')}</span></span><button class="btn" onclick="syRestore(${i})">Taasta</button></div>`).join('')}</div></details>`}catch(e){}
 crewTail=team+add+bk;const allw=p.crew.length?`<details class="card"><summary class="font-bold">Kõigile korraga: tegelik wrap</summary><div class="space-y-2 mt-2"><div class="flex gap-2 items-center"><input id="aw" type="text" inputmode="numeric" maxlength="5" placeholder="TT:MM" data-t24="1" value="${esc(p.crew.find(c=>c.act)?.act||p.wrap||'')}" class="text-center text-xl font-extrabold tabular-nums"><button class="btn p" onclick="setAllAct()">Pane kõigile</button></div><div class="sub">Kirjutab kõigi tänaste meeskonnaliikmete tegeliku wrapi. Üksikut saad pärast ikka eraldi muuta.${p.crew.some(c=>c.act)?' <button class="underline" onclick="clearAllAct()">Tühjenda kõigi tegelik wrap</button>':''}</div></div></details>`:'';return dl+allw+(cards||'<div class="card sub">Sellel päeval pole meeskonda. Lae call sheet või lisa käsitsi.</div>')+hist}
function delDay(d){const p=P();if(!confirm('Kustutan '+d.slice(8)+'.'+d.slice(5,7)+'.'+d.slice(0,4)+' tunnid ja päeva andmed?'))return;syBackup('enne päeva kustutamist');delete p.cd[d];if(p.dd)delete p.dd[d];if(p.date==d){const k=Object.keys(p.cd).sort().pop()||today();setDate(p,k)}save();r()}
const nowHM=()=>{const n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')};
function lunchQ(p){const k=p.lk&&p.lk.d==p.date?p.lk:null;
 return k?'':`<button class="btn w-full mt-2" onclick="lunchStart()">🍽 Lõuna algas</button>`}
const T24=(id,v,js,x='')=>`<input ${id?'id="'+id+'" ':''}type="text" inputmode="numeric" maxlength="5" ${/placeholder/.test(x)?'':'placeholder="TT:MM"'} data-t24="1" value="${esc(v||'')}" ${js?'onchange="'+js+'"':''} ${x}>`;
const okT=v=>/^\d{1,2}:\d{2}$/.test(v);
function setCallAll(){const v=($('#cl')||{}).value;if(!okT(v))return;const t=tf(tm(v)),p=P();p.call=t;p.crew.forEach(c=>{if(c.call)c.call=t});lunchEd=false;save();r()}
function setCrewT(i,f,v){const c=P().crew[i];if(!c)return;if(okT(v))c[f]=tf(tm(v));else if(f=='act'&&!v)c.act='';else return;save()}
function crewRows(p,f,ph){return p.crew.map((c,i)=>[c,i]).filter(([c])=>c.call).map(([c,i])=>`<div class="flex items-center gap-2"><span class="flex-1 min-w-0 truncate">${esc(c.name||'')} <span class="sub">${esc(c.role||'')}</span></span>${T24('',c[f],"setCrewT("+i+",'"+f+"',this.value)",'placeholder="'+esc(ph||'TT:MM')+'" style="width:6.5rem;text-align:center"')}</div>`).join('')||'<div class="sub">Sellel päeval pole meeskonda.</div>'}
function callPanel(p){if(lunchEd!='call'||!canDay())return '';
 return `<div class="card space-y-3" id="lpan"><b>Call</b><div class="flex gap-2 items-end"><label class="sub flex-1">Kõigile${T24('cl',p.call,'')}</label><button class="btn p" onclick="setCallAll()">Pane kõigile</button></div><div class="sub">Üksikute call (nt juhid varem):</div>${crewRows(p,'call')}<button class="btn w-full" onclick="dayEdit('call')">Valmis</button></div>`}
function wrapPanel(p){if(lunchEd!='wrap'||!canDay())return '';const a=p.crew.find(c=>c.act);
 return `<div class="card space-y-3" id="lpan"><b>Wrap</b><div class="flex gap-2 items-end"><label class="sub flex-1">Kõigile${T24('ac',(a&&a.act)||p.wrap,'')}</label><button class="btn p" onclick="lunchEd=false;setAllAct('ac')">Pane kõigile</button></div><div class="sub">Üksikute tegelik wrap:</div>${crewRows(p,'act',p.wrap)}<div class="flex gap-2"><button class="btn" onclick="lunchEd=false;clearAllAct()">Tühjenda</button><button class="btn flex-1" onclick="dayEdit('wrap')">Valmis</button></div></div>`}
const canDay=()=>['admin','bestboy',''].includes(er()||'');
let lunchEd=false;
function lunchEdit(){dayEdit('lunch')}
function dayEdit(k){lunchEd=lunchEd==k?false:k;r();if(lunchEd)setTimeout(()=>{const e=document.getElementById('lpan');e&&e.scrollIntoView({block:'center',behavior:'smooth'})},60)}
function lunchSet(f,v){const p=P();if(!/^\d{1,2}:\d{2}$/.test(v))return;v=tf(tm(v));const k=p.lk&&p.lk.d==p.date?p.lk:null;if(f=='s'){p.lunch=v;if(k){const d=tm(v)-tm(k.s);k.s=v;if(k.e)k.e=tf(tm(k.e)+d)}}else if(k)k.e=v;save();r()}
function lunchPanel(p){if(lunchEd!='lunch'||!canDay())return '';const k=p.lk&&p.lk.d==p.date?p.lk:null,L=+p.lunchLen||60,td=p.date==workDay(),s0=k?k.s:p.lunch,en=k?(k.e||tf(tm(k.s)+L)):(p.lunch?tf(tm(p.lunch)+L):'');
 return `<div class="card space-y-2" id="lpan"><div class="flex gap-3"><label class="sub flex-1">Algus${inp('time',s0,"lunchSet('s',this.value)")}</label><label class="sub flex-1">Lõpp${k?inp('time',en,"lunchSet('e',this.value)"):`<div class="font-bold text-xl mt-1">${esc(en||'–')}</div>`}</label></div><div class="sub">Lõuna kestab ${L} min ja lõpeb ise, siis hakkab wrapi loendus.</div><div class="flex gap-2">${td&&!k?`<button class="btn p flex-1" onclick="lunchEd=false;lunchStart()">Algas praegu</button>`:''}${k?`<button class="btn flex-1" onclick="lunchEd=false;lunchEnd()">Lõpeta praegu</button><button class="btn" onclick="lunchEd=false;lunchClr()">Tühista</button>`:''}<button class="btn" onclick="lunchEdit()">Valmis</button></div></div>`}
function lunchStart(){const p=P(),t=nowHM();p.lk={d:p.date,s:t,e:''};p.lunch=t;save();r()}
function lunchEnd(){const p=P();if(p.lk&&p.lk.d==p.date){p.lk.e=nowHM();save();r()}}
function lunchClr(){const p=P();p.lk=null;save();r()}
const MH={extra:new Set(),mode:'d',sel:'',who:'',mo:null,names:[]};
function mhCard(){return ''}
function mhOpen(){tab='mh';r()}
function vMH(p){return '<div id="mhin"></div>'}
function mhClose(){tab='day';r()}
